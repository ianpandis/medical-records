name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos, build y e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Valores falsos: el build solo los embebe, no se conecta a ningún Supabase
          VITE_SUPABASE_URL: https://ci-mock.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-anon-key

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      # Supabase simulado (ver e2e/env.ts y e2e/fixtures.ts): no toca ninguna base real
      - name: Tests e2e
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
